<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpConnect İndirme Merkezi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1b2a; /* Koyu lacivert arka plan */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #1b263b; /* Kart arka planı */
            width: 100%;
            max-width: 420px;
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #283853;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 2px 8px rgba(255,255,255,0.1));
        }

        h1 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 14px;
            color: #e0e1dd;
            margin-bottom: 28px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-ios {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #333;
        }

        .btn-android {
            background-color: #01875f;
            color: #ffffff;
        }

        .btn-pdf {
            background-color: #d9381e;
            color: #ffffff;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #778da9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GitHub'a Yüklediğiniz logo.png Dosyası -->
        <img src="logo.png" alt="Gresan Logo" class="logo">

        <h1>PumpConnect</h1>
        <p class="subtitle">Mobil İndirme ve Dokümantasyon Portalı</p>

        <div class="btn-group">
            <!-- iOS App Store Button -->
            <a href="https://apps.apple.com/ng/app/pumpconnect/id6771354184" class
