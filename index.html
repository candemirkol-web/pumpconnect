<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpConnect İndirme Merkezi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #09131e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #122232;
            border: 1px solid #1c3349;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
            /* Filtre kaldırıldı, logonun orijinal rengi korundu */
        }

        h1 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #8da4b8;
            margin-bottom: 28px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-ios, .btn-android, .btn-pdf {
            background-color: #1a2f44;
            color: #00d2c4;
            border-color: #24415e;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
            font-weight: 700;
        }

        .btn-share {
            background-color: transparent;
            color: #8da4b8;
            border-color: #24415e;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: #5c748a;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #00d2c4;
            color: #09131e;
            font-weight: 600;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

        <!-- Logo -->

        </div>

        <div class="footer">
            &copy; Gresan Lubrication Solutions
        </div>
    </div>

    <div id="toast">Bağlantı kopyalandı!</div>

    <script>
        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'PumpConnect İndirme Merkezi',
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
            }
        }
    </script>
</body>
</html>
