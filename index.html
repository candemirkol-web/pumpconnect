<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PumpConnect - Uygulama İndir & Kullanım Kılavuzu</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gresan: {
                            blue: '#003B70',
                            navy: '#0b192c',
                            gray: '#717378',
                            lightBg: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b192c 0%, #1e293b 60%, #0f172a 100%);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .logo-container {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 sm:p-6">

    <div class="w-full max-w-md mx-auto my-auto py-6 sm:py-10">
        <!-- Main Card Wrapper -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Top Gradient Accent Line -->
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-cyan-400 to-slate-400"></div>

            <!-- Header & Logo Section -->
            <div class="text-center mb-8 pt-2">
                <!-- Gresan Logo Display Container -->
                <div class="logo-container inline-flex items-center justify-center p-4 rounded-2xl mb-5 border border-slate-200/50 max-w-[220px]">
                    <img src="https://lh3.googleusercontent.com/d/1Xl2KkK6y7f2R_dOq7P2Gv2d-E6t_uGg0" 
                         alt="Gresan Lubrication Solutions" 
                         class="h-12 w-auto object-contain"
                         onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'text-gresan-blue font-extrabold text-2xl tracking-wider uppercase p-2\'>GRESAN</div>';">
                </div>
                
                <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">PumpConnect</h1>
                <div class="w-12 h-1 bg-blue-500 mx-auto rounded-full mt-2 opacity-80"></div>
            </div>

            <!-- Main Buttons Container -->
            <div class="space-y-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-center mb-4">
                    İndirme Seçenekleri & Dokümanlar
                </p>

                <!-- iOS App Store Button -->
                <a id="btn-ios" 
                   href="https://apps.apple.com/ng/app/pumpconnect/id6771354184" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="w-full group flex items-center justify-between p-4 rounded-2xl bg-slate-800/90 hover:bg-blue-600/20 border border-slate-700/80 hover:border-blue-500/60 transition-all duration-300 transform active:scale-98 shadow-md">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-slate-900/90 flex items-center justify-center text-white text-2xl group-hover:scale-110 group-hover:text-blue-400 transition-all">
                            <i class="fa-brands fa-apple"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-xs text-slate-400 font-medium">iOS Cihazlar İçin</p>
                            <p class="text-base font-semibold text-white group-hover:text-blue-300 transition-colors">App Store'dan İndir</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-blue-400 group-hover:translate-x-1 transition-all"></i>
                </a>

                <!-- Android Google Play Store Button -->
                <a id="btn-android" 
                   href="https://play.google.com/store/apps/details?id=com.gresan.pumpconnect&pcampaignid=web_share" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="w-full group flex items-center justify-between p-4 rounded-2xl bg-slate-800/90 hover:bg-emerald-600/20 border border-slate-700/80 hover:border-emerald-500/60 transition-all duration-300 transform active:scale-98 shadow-md">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-slate-900/90 flex items-center justify-center text-emerald-400 text-2xl group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-google-play"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-xs text-slate-400 font-medium">Android Cihazlar İçin</p>
                            <p class="text-base font-semibold text-white group-hover:text-emerald-300 transition-colors">Google Play'den İndir</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-500 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all"></i>
                </a>

                <!-- Divider -->
                <div class="relative my-5">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700/60"></div></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900/90 px-3 text-slate-400 font-medium rounded-full">veya</span></div>
                </div>

                <!-- PDF User Manual Button -->
                <a id="btn-pdf" 
                   href="kilavuz.pdf" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="w-full group flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-amber-500/10 via-amber-500/5 to-orange-500/10 hover:from-amber-500/20 hover:to-orange-500/20 border border-amber-500/40 hover:border-amber-500/70 transition-all duration-300 transform active:scale-98 shadow-md">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 text-2xl group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-file-pdf"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-xs text-amber-400/90 font-medium">Kullanım Dokümanı</p>
                            <p class="text-base font-semibold text-white group-hover:text-amber-300 transition-colors">Kullanım Kılavuzu (PDF)</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-down-long text-amber-400 group-hover:translate-y-0.5 transition-transform"></i>
                </a>
            </div>

            <!-- Footer -->
            <div class="mt-8 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
                <p>© 2026 Gresan Lubrication Solutions</p>
                <p class="text-[10px] text-slate-500 mt-0.5">Tüm hakları saklıdır.</p>
            </div>
        </div>
    </div>

</body>
</html>
